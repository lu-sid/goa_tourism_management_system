-width="1.6" marker-end="url(#arr)"/><rect x="655" y="820" width="320" height="78" rx="8" fill="#e5f5ec" stroke="#398456" stroke-width="1.7"/><text x="667" y="843" text-anchor="#12343b" font-family="Arial" font-size="15" font-weight="bold" fill="#263b40">Open directions (optional)</text><text x="667" y="866" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#263b40">External Google Maps URL</text><path d="M815 898 L815 970" stroke="#52747a" stroke-width="1.6" marker-end="url(#arr)"/><circle cx="815" cy="990" r="12" fill="#12343b"/><text x="32" y="1030" text-anchor="#52666b" font-family="Arial" font-size="12" font-weight="normal" fill="#263b40">Saved places remain in browser state and reset on refresh; no booking or admin workflow is implemented.</text></svg>