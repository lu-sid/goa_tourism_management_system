<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="510" viewBox="0 0 1070 510">
<rect width="100%" height="100%" fill="#f7fafc"/><text x="32" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#12343b">Use Case Diagram</text>
<text x="32" y="67" font-family="Arial" font-size="12" fill="#52666b">Grounded in repository code · green = implemented · amber = schema only/planned</text><rect x="35" y="105" width="215" height="80" rx="7" fill="#e5f5ec" stroke="#398456" stroke-width="1.5"/><text x="45" y="125" font-family="Arial" font-size="14" font-weight="700" fill="#12343b">Tourist</text><text x="45" y="145" font-family="Arial" font-size="12" fill="#263b40">Implemented actor</text><rect x="300" y="90" width="420" height="100" rx="7" fill="#e5f5ec" stroke="#398456" stroke-width="1.5"/><text x="310" y="110" font-family="Arial" font-size="14" font-weight="700" fill="#12343b">Implemented discovery</text><text x="310" y="130" font-family="Arial" font-size="12" fill="#263b40">Search location / nearby by GPS</text><text x="310" y="147" font-family="Arial" font-size="12" fill="#263b40">Filter, view cards and map, open directions</text><text x="310" y="164" font-family="Arial" font-size="12" fill="#263b40">Save/remove places in browser session</text><rect x="790" y="105" width="245" height="80" rx="7" fill="#e5f5ec" stroke="#398456" stroke-width="1.5"/><text x="800" y="125" font-family="Arial" font-size="14" font-weight="700" fill="#12343b">External services</text><text x="800" y="145" font-family="Arial" font-size="12" fill="#263b40">Nominatim · Overpass</text><text x="800" y="162" font-family="Arial" font-size="12" fill="#263b40">OSM · Wikimedia Commons</text><path d="M250,140 L300,140" stroke="#52747a" stroke-width="1.3" marker-end="url(#arrow)"/><text x="275" y="135" font-family="Arial" font-size="10" fill="#344f54">uses</text><path d="M720,140 L790,140" stroke="#52747a" stroke-width="1.3" marker-end="url(#arrow)"/><text x="755" y="135" font-family="Arial" font-size="10" fill="#344f54">fetches data</text><rect x="35" y="235" width="485" height="230" rx="7" fill="#fff3d6" stroke="#bd8730" stroke-width="1.5"/><text x="45" y="255" font-family="Arial" font-size="14" font-weight="700" fill="#12343b">Admin / tourism features — planned or unimplemented</text><text x="45" y="275" font-family="Arial" font-size="12" fill="#263b40">Register/login; hotels/restaurants; tour packages</text><text x="45" y="292" font-family="Arial" font-size="12" fill="#263b40">Booking and payment; reviews; feedback</text><text x="45" y="309" font-family="Arial" font-size="12" fill="#263b40">Admin content management</text><text x="45" y="326" font-family="Arial" font-size="12" fill="#263b40">Evidence: schemas exist for User, Hotel, Restaurant, TourPackage,</text><text x="45" y="343" font-family="Arial" font-size="12" fill="#263b40">Booking, Payment, Review, Feedback; routes/controllers are empty.</text><rect x="570" y="235" width="465" height="230" rx="7" fill="#fff3d6" stroke="#bd8730" stroke-width="1.5"/><text x="580" y="255" font-family="Arial" font-size="14" font-weight="700" fill="#12343b">Use-case relationship notes</text><text x="580" y="275" font-family="Arial" font-size="12" fill="#263b40">Current discovery flow: typed search includes geocoding then nearby query.</text><text x="580" y="292" font-family="Arial" font-size="12" fill="#263b40">Optional GPS search bypasses geocoding.</text><text x="580" y="309" font-family="Arial" font-size="12" fill="#263b40">Keyword/category filtering extends display of results.</text><text x="580" y="326" font-family="Arial" font-size="12" fill="#263b40">No implemented include/extend behavior for booking/payment/reviews.</text></svg>